listen:
  host: 0.0.0.0      # bind address
  port: 8080          # bind port

cors:
  enabled: true       # set false to disable CORS entirely
  allow_origins: ["*"]  # lock down to specific origins in production (e.g. ["https://webui.example.com"])
  allow_methods: ["*"]
  allow_headers: ["*"]

auth:
  api_key: null       # set a string to require Bearer token auth

rate_limit:           # per-IP sliding window rate limiting (disabled by default)
  enabled: false
  requests_per_minute: 60
  endpoints:
    "/v1/chat/completions": 30   # stricter for heavy endpoint
    "/v1/embeddings": 20

models:
  - name: "fast-agent"
    url: "http://backend:8080"
    provider: llama.cpp          # display hint for frontends like OWUI
    backend: openai_compatible   # adapter type selector
    api_key: null                # optional per-model backend auth token (${VAR} expanded)
    default_params:
      temperature: 0.7
      top_p: 0.95

  - name: "slow-thinker"
    url: "http://backend:8081"
    provider: llama.cpp
    default_params:
      temperature: 0.7
      top_p: 0.9

# ── Static file serving ───────────────────────────────────────────────
# Serve files from filesystem directories at configured URL paths.
# Multiple directories per path are supported (first match wins).
static_files:
  - path: "/docs"
    directories:
      - ./docs  # directory existence checked at mount time; skipped with warning if missing

health_check_interval: 2.0      # seconds between backend health probes
